[project]
name = "mlplayground-backend"
version = "0.1.0"
description = "MLPlayground - Agricultural ML Platform Backend"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard]>=0.114.2,<1.0.0",
    "sqlmodel>=0.0.21,<1.0.0",
    "alembic>=1.12.1,<2.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "psycopg[binary]>=3.1.13,<4.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "daymetpy>=1.0.0",
    "tenacity>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
